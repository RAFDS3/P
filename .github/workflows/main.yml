name: Build APK from ZIP

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:
    inputs:
      commit_sources:
        description: 'Commit juga hasil ekstrak ke repo'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak ZIP
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "Tidak ada file .zip di root repo"; exit 1; fi
          mkdir -p src_extracted
          unzip -q -o "$ZIP" -d src_extracted
          SETTINGS=$(find src_extracted -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts tidak ditemukan di dalam zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Commit hasil ekstrak (opsional)
        if: ${{ github.event.inputs.commit_sources == 'true' }}
        run: |
          rsync -a --exclude '.github' "$PROJECT_DIR"/ ./
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -- . ':!src_extracted'
          git commit -m "Ekstrak source dari ZIP" || echo "Tidak ada perubahan"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: asisten-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
